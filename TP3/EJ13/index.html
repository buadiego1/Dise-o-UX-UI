<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 13 - Formulario estilizado</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="contenedor">

        <h1>MB Repuestos</h1>
        <p class="subtitulo">Contactate con nosotros</p>

        <form action="#" method="post">

            <div class="campo">
                <label for="nombre">Nombre completo</label>
                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Ingresá tu nombre"
                    required
                >
            </div>

            <div class="campo">
                <label for="email">Correo electrónico</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="ejemplo@gmail.com"
                    required
                >
            </div>

            <div class="campo">
                <label for="repuesto">Repuesto que buscás</label>
                <input
                    type="text"
                    id="repuesto"
                    name="repuesto"
                    placeholder="Ej: amortiguadores"
                    required
                >
            </div>

            <div class="campo">
                <label for="mensaje">Mensaje</label>
                <textarea
                    id="mensaje"
                    name="mensaje"
                    placeholder="Escribí tu consulta..."
                    required
                ></textarea>
            </div>

            <button type="submit">Enviar consulta</button>

        </form>

    </main>

</body>
</html>
