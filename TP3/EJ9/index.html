<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 9 - Galería de Tarjetas</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1>Vehículos disponibles</h1>
        <p>Elegí tu proximo vehículo.</p>
    </header>

    <main class="galeria">

        <div class="card">
            <img src="imagenes/corolla.jpg" alt="Toyota Corolla">
            <h2>Toyota Corolla</h2>
            <p class="precio">$22.000.000</p>
            <button>Ver vehículo</button>
        </div>

        <div class="card">
            <img src="imagenes/golf.jpg" alt="Volkswagen Golf">
            <h2>Volkswagen Golf</h2>
            <p class="precio">$25.000.000</p>
            <button>Ver vehículo</button>
        </div>

        <div class="card">
            <img src="imagenes/mustang.jpg" alt="Ford Mustang">
            <h2>Ford Mustang</h2>
            <p class="precio">$65.000.000</p>
            <button>Ver vehículo</button>
        </div>

        <div class="card">
            <img src="imagenes/civic.jpg" alt="Honda Civic">
            <h2>Honda Civic</h2>
            <p class="precio">$27.000.000</p>
            <button>Ver vehículo</button>
        </div>

        <div class="card">
            <img src="imagenes/cruze.jpg" alt="Chevrolet Cruze">
            <h2>Chevrolet Cruze</h2>
            <p class="precio">$19.000.000</p>
            <button>Ver vehículo</button>
        </div>

        <div class="card">
            <img src="imagenes/vento.jpg" alt="Volkswagen Vento">
            <h2>Volkswagen Vento</h2>
            <p class="precio">$24.000.000</p>
            <button>Ver vehículo</button>
        </div>

    </main>

</body>
</html>
