<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 6 - Selectores CSS</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <h1 id="titulo">Autos destacados</h1>

    <p>Estos son algunos ejemplos de vehículos.</p>

    <div class="card">
        <h2>Volkswagen Golf</h2>
        <p>Motor: 1.4 TSI</p>
        <p class="precio">Precio: $18.500.000</p>
        <span>Disponible</span>
    </div>

    <div class="card hibrido">
        <h2>Toyota Corolla</h2>
        <p>Motor: 1.8 Híbrido</p>
        <p class="precio">Precio: $22.000.000</p>
        <span>Híbrido</span>
    </div>

    <div class="card destacado">
        <h2>Ford Mustang</h2>
        <p>Motor: 5.0 V8</p>
        <p class="precio">Precio: $65.000.000</p>
        <span>Última unidad</span>
    </div>

</body>
</html>
